trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  ACR_NAME: 'dockerwebserveracr'
  IMAGE_NAME: 'docker-webserver'
  TAG: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: 'Build and Test Docker Image'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    steps:

    - script: |
        docker build -t $(IMAGE_NAME):$(TAG) .
        echo "Docker image built successfully!"
      displayName: 'Build Docker Image'

    - script: |
        docker run -d -p 8080:8080 --name test-container $(IMAGE_NAME):$(TAG)
        sleep 5
        curl -f http://localhost:8080/health
        echo "Health check passed!"
        docker stop test-container
        docker rm test-container
      displayName: 'Test Container Health'

- stage: Push
  displayName: 'Push to Azure Container Registry'
  dependsOn: Build
  jobs:
  - job: PushJob
    displayName: 'Push Docker Image to ACR'
    steps:

    - task: Docker@2
      displayName: 'Build and Push to ACR'
      inputs:
        command: 'buildAndPush'
        dockerfile: 'Dockerfile'
        containerRegistry: 'acr-connection'
        repository: '$(IMAGE_NAME)'
        tags: |
          $(TAG)
          latest

- stage: Deploy
  displayName: 'Deploy Container to Azure Web App'
  dependsOn: Push
  jobs:
  - job: DeployJob
    displayName: 'Deploy to Azure Web App'
    steps:

    - task: AzureWebAppContainer@1
      displayName: 'Deploy Docker Container'
      inputs:
        azureSubscription: 'java-gradle-connection'
        appName: 'docker-webserver-app'
        containers: '$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(TAG)'